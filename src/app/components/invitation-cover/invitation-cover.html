<article
  class="cover-card"
  [class.is-opening]="isOpening()"
  [attr.aria-busy]="isOpening()"
  aria-labelledby="invitation-cover-heading"
  aria-describedby="invitation-cover-message"
>
  <span class="floral-corner floral-corner-top" aria-hidden="true"></span>
  <span class="floral-corner floral-corner-bottom" aria-hidden="true"></span>

  <p class="family-line">{{ labels().coverFamilyLine }}</p>
  <h1 id="invitation-cover-heading">{{ labels().coverTitle }}</h1>
  <p id="invitation-cover-message" class="message">{{ messages().welcomeMessage }}</p>

  <div class="envelope-wrap" aria-hidden="true">
    <div class="envelope">
      <span class="invitation-card"></span>
      <span class="envelope-flap"></span>
      <span class="seal">{{ sealText() }}</span>
    </div>
  </div>

  <button
    class="primary-action open-action"
    type="button"
    [disabled]="isOpening()"
    [attr.aria-label]="
      isOpening() ? labels().openingInvitationAriaLabel : labels().openInvitationAriaLabel
    "
    (click)="open()"
  >
    {{ isOpening() ? labels().openingInvitation : labels().openInvitation }}
  </button>
</article>
