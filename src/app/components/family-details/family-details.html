<section class="family-details" [attr.aria-label]="labels().familyBlessingsAriaLabel">
  <span class="family-divider" aria-hidden="true"></span>
  <p>{{ labels().familyBlessingsIntro }}</p>

  <div class="family-names">
    <span>{{ families().brideFamily }}</span>
    <em>{{ labels().familySeparator }}</em>
    <span>{{ families().groomFamily }}</span>
  </div>
</section>
