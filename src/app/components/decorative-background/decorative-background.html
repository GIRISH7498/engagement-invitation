<div
  class="decorative-background"
  aria-hidden="true"
  [style.--engagement-primary]="theme().primaryColor"
  [style.--engagement-secondary]="theme().secondaryColor"
  [style.--engagement-text]="theme().secondaryColor"
  [style.--engagement-bg]="theme().backgroundColor"
  [style.--engagement-gold]="theme().accentColor"
>
  <span class="corner-floral corner-floral-top"></span>
  <span class="corner-floral corner-floral-bottom"></span>
  <span class="heart heart-one"></span>
  <span class="heart heart-two"></span>
  <span class="heart heart-three"></span>
  <span class="petal petal-one"></span>
  <span class="petal petal-two"></span>
  <span class="petal petal-three"></span>
  <span class="particle particle-one"></span>
  <span class="particle particle-two"></span>
  <span class="particle particle-three"></span>
  <span class="spark spark-one"></span>
  <span class="spark spark-two"></span>
</div>
